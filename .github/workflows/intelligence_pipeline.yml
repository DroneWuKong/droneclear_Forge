name: Forge Intelligence Pipeline

on:
  schedule:
    - cron: '0 6 * * *'    # daily 06:00 UTC
    - cron: '0 4 * * 0'    # sunday 04:00 UTC
  workflow_dispatch:
    inputs:
      group:
        description: 'Miner or run mode'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - rotorbuilds
          - ardupilot_discourse
          - blue_uas
          - sam_gov
          - pilotinstitute
          - diyfpv_catalog
          - intel
          - defense
          - commercial
          - enrichment
          - firmware
          - troubleshooting
          - analytics
          - full
      dry_run:
        description: 'Dry run: run miners but skip normalizers and git commit'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  intelligence:
    name: Forge intelligence run
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Run mining pipeline
        env:
          SAM_GOV_API_KEY: ${{ secrets.SAM_GOV_API_KEY }}
          FORGE_MINE_UA: ${{ secrets.FORGE_MINE_UA }}
          INPUT_GROUP: ${{ github.event.inputs.group || 'all' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail

          if [ ! -f tools/mining/run_all.py ]; then
            echo "ERROR: tools/mining/run_all.py was not found."
            echo "The old workflow expected miners/mine_all.py, but this repo uses tools/mining/run_all.py."
            exit 1
          fi

          FLAGS="--max 50"
          if [ "$DRY_RUN" = "true" ]; then
            FLAGS="$FLAGS --dry"
          fi

          case "$INPUT_GROUP" in
            rotorbuilds|ardupilot_discourse|blue_uas|sam_gov|pilotinstitute|diyfpv_catalog)
              python3 tools/mining/run_all.py --miner "$INPUT_GROUP" $FLAGS
              ;;
            all|full|intel|defense|commercial|enrichment|firmware|troubleshooting|analytics|"")
              python3 tools/mining/run_all.py $FLAGS
              ;;
            *)
              echo "Unknown group/miner: $INPUT_GROUP"
              exit 1
              ;;
          esac

      - name: Optional analytics gap mining
        if: always()
        env:
          ANALYTICS_ADMIN_KEY: ${{ secrets.ANALYTICS_ADMIN_KEY }}
          FORGE_SITE: https://uas-forge.com
        run: |
          if [ -f miners/mine_from_analytics.py ]; then
            python3 miners/mine_from_analytics.py --mine --top 5 --days 30 || true
          else
            echo "Skipping analytics miner: miners/mine_from_analytics.py not present."
          fi

      - name: Optional VAR/manufacturer health scan
        if: always()
        run: |
          if [ -f miners/mine_vars.py ]; then
            python3 miners/mine_vars.py --apply || true
          else
            echo "Skipping VAR scan: miners/mine_vars.py not present."
          fi

      - name: Commit changes
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "CHANGES=none" >> "$GITHUB_ENV"
          else
            NFILES=$(git diff --staged --name-only | wc -l)
            git commit -m "chore(miners): intelligence pipeline update $(date -u +%Y-%m-%d) - ${NFILES} files [skip ci]"
            git push
            echo "CHANGES=$(git diff HEAD~1 --stat | tail -1)" >> "$GITHUB_ENV"
          fi

      - name: Step summary
        if: always()
        env:
          INPUT_GROUP: ${{ github.event.inputs.group || 'scheduled' }}
        run: |
          echo "## Forge Intelligence Pipeline — $(date -u +%Y-%m-%d)" >> "$GITHUB_STEP_SUMMARY"
          echo "**Status:** ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Run mode:** $INPUT_GROUP" >> "$GITHUB_STEP_SUMMARY"
          echo "**Changes:** ${CHANGES:-unknown}" >> "$GITHUB_STEP_SUMMARY"

      - name: Email notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "Forge Intelligence Pipeline — ${{ job.status }}"
          to: jeremiah@midwestniceuas.com
          from: Forge Pipeline <${{ secrets.SMTP_USER }}>
          body: |
            Forge Intelligence Pipeline — ${{ job.status }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Changes: ${{ env.CHANGES }}
        continue-on-error: true
