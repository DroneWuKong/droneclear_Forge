name: Apply cited Ask PIE retrieval

on:
  push:
    branches:
      - feat/cited-ask-pie-retrieval-20260731
    paths:
      - "forge-source/ask-pie.html"
      - "forge-source/ask-pie-retrieval.js"
      - "tests/test_ask_pie_retrieval.cjs"
      - "tools/apply_ask_pie_patch.py"
      - ".github/workflows/apply-ask-pie.yml"
  pull_request:
    paths:
      - "forge-source/ask-pie.html"
      - "forge-source/ask-pie-retrieval.js"
      - "tests/test_ask_pie_retrieval.cjs"
      - "tools/apply_ask_pie_patch.py"
      - ".github/workflows/apply-ask-pie.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-ask-pie-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cited-ask-pie-retrieval-20260731
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply narrow cross-surface edits
        run: python tools/apply_ask_pie_patch.py --apply

      - name: Run software-only validation before commit
        run: |
          python -m py_compile tools/apply_ask_pie_patch.py
          python tools/apply_ask_pie_patch.py --check
          node --check forge-source/ask-pie-retrieval.js
          node --test tests/test_ask_pie_retrieval.cjs

      - name: Commit non-workflow integration edits
        run: |
          set -euo pipefail
          # The default GITHUB_TOKEN cannot push workflow-file changes. Restore
          # the quality workflow here; it is updated directly after this commit.
          git checkout -- .github/workflows/public-site-quality.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            build_static.py \
            forge-source/patterns-home.html \
            forge-source/pie-search.html \
            tools/smoke_public_deployment.py
          if git diff --staged --quiet; then
            echo "No non-workflow Ask PIE changes to commit"
            exit 0
          fi
          git commit -m "feat(ask-pie): integrate cited evidence retrieval"
          git push origin HEAD:feat/cited-ask-pie-retrieval-20260731
