name: Apply Phase 1 Dossier Signals

on:
  push:
    branches:
      - feat/entity-dossier-pattern-signals-20260731
    paths:
      - tools/apply_dossier_signals.py
      - forge-source/dossier-signals.js
      - tests/test_dossier_signals.cjs
      - .github/workflows/apply-dossier-signals.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-dossier-signals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/entity-dossier-pattern-signals-20260731
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply deterministic dossier patches
        run: python tools/apply_dossier_signals.py

      - name: Run software-only module and site validation
        run: |
          set -euo pipefail
          node --test tests/test_dossier_signals.cjs
          node --check forge-source/dossier-signals.js
          python -m py_compile build_static.py tools/audit_public_site.py tests/test_public_site_audit.py
          python -m unittest -v tests/test_public_site_audit.py
          python tools/audit_public_site.py --strict --require-catalog --dry-run
          python build_static.py
          python tools/audit_public_site.py --site-dir build --built --strict --require-catalog --dry-run

      - name: Commit validated non-workflow changes
        run: |
          set -euo pipefail
          rm -f tools/apply_dossier_signals.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add forge-source/dossier.html forge-source/dossier-signals.js tests/test_dossier_signals.cjs tools/audit_public_site.py tools/apply_dossier_signals.py
          git commit -m "feat(dossier): join current Patterns signals with vendor evidence [skip ci]"
          git pull --rebase origin feat/entity-dossier-pattern-signals-20260731
          git push origin HEAD:feat/entity-dossier-pattern-signals-20260731
