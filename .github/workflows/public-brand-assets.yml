name: Public icon and sharing assets
on:
  pull_request:
    paths: ['tools/public_brand_assets.py', 'tests/test_public_brand_assets.py', 'build_static.py', '.github/workflows/public-brand-assets.yml']
  push:
    branches: [master]
    paths: ['tools/public_brand_assets.py', 'tests/test_public_brand_assets.py', 'build_static.py', '.github/workflows/public-brand-assets.yml']
permissions:
  contents: read
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -p test_public_brand_assets.py -v
