name: Apply Phase 0 Built-Site Follow-up

on:
  push:
    branches:
      - feat/data-quality-and-site-consistency-20260731
    paths:
      - tools/apply_phase0_followup.py
      - .github/workflows/apply-phase0-followup.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-phase0-followup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/data-quality-and-site-consistency-20260731
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply deterministic source patches
        run: python tools/apply_phase0_followup.py

      - name: Run software-only validation
        run: |
          set -euo pipefail
          python -m py_compile build_static.py tools/audit_public_site.py tests/test_public_site_audit.py
          python -m unittest -v tests/test_public_site_audit.py
          python tools/audit_public_site.py --strict --require-catalog --dry-run
          python build_static.py
          python tools/audit_public_site.py --site-dir build --built --strict --require-catalog --dry-run

      - name: Commit non-workflow fixes
        run: |
          set -euo pipefail
          rm -f tools/apply_phase0_followup.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build_static.py tools/audit_public_site.py tests/test_public_site_audit.py forge-source/evasion.html tools/apply_phase0_followup.py
          git commit -m "fix(site): resolve built relative routes and duplicate injected nav [skip ci]"
          git pull --rebase origin feat/data-quality-and-site-consistency-20260731
          git push origin HEAD:feat/data-quality-and-site-consistency-20260731
