name: Check or repair UAS www redirects
on:
  push:
    branches: [master]
    paths: ['tools/repair_www_redirects.py', '.github/workflows/www-redirect-repair.yml']
  pull_request:
    paths: ['tools/repair_www_redirects.py', 'tests/test_www_redirects.py', '.github/workflows/www-redirect-repair.yml']
  workflow_dispatch:
    inputs:
      target:
        description: 'Fixed hostnames to check or repair'
        type: choice
        options: [www, legacy-intel]
        default: www
      mode:
        description: 'Check is read-only; apply repairs the selected redirects'
        type: choice
        options: [check, apply]
        default: check
permissions:
  contents: read
concurrency:
  group: uas-www-redirect-repair
  cancel-in-progress: false
jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -p test_www_redirects.py -v
  cloudflare:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preflight or apply scoped redirect configuration
        if: github.event_name == 'push' || inputs.target != 'legacy-intel'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLAR_API_TOKEN }}
          UAS_REDIRECT_MODE: ${{ inputs.mode || 'apply' }}
        run: |
          if test "$UAS_REDIRECT_MODE" = apply; then
            python3 tools/repair_www_redirects.py --apply
          else
            python3 tools/repair_www_redirects.py
          fi
      - name: Check or repair legacy Intel redirects
        if: github.event_name == 'push' || inputs.target == 'legacy-intel'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLAR_API_TOKEN }}
          UAS_REDIRECT_MODE: ${{ inputs.mode || 'apply' }}
        run: |
          if test "$UAS_REDIRECT_MODE" = apply; then
            python3 tools/repair_www_redirects.py --legacy-intel --apply
          else
            python3 tools/repair_www_redirects.py --legacy-intel
          fi
      - name: Verify public Intel redirects after apply
        if: github.event_name == 'push' || (inputs.target == 'legacy-intel' && inputs.mode == 'apply')
        run: |
          for host in uas-intel.com www.uas-intel.com; do
            for attempt in 1 2 3 4; do
              path="/intel/feed/?from=redirect-check&probe=$GITHUB_RUN_ID-$attempt"
              actual=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code} %{redirect_url}' "https://$host$path") || actual="request failed"
              if test "$actual" = "301 https://uas-patterns.com$path"; then break; fi
              echo "$host returned $actual"
              if test "$attempt" = 4; then exit 1; fi
              sleep 5
            done
          done
