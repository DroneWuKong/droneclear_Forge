name: "📱 Forge RF Toolbox — Debug APK"

on:
  push:
    branches: [ "main", "master", "claude/**" ]
    paths:
      - 'android-rf-toolbox/**'
      - '.github/workflows/android-debug-apk.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'android-rf-toolbox/**'
      - '.github/workflows/android-debug-apk.yml'
  workflow_dispatch:

concurrency:
  group: forge-rf-toolbox-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle wrapper
        working-directory: android-rf-toolbox
        run: gradle wrapper --gradle-version 8.6

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: forge-rf-${{ hashFiles('android-rf-toolbox/**/*.gradle*') }}
          restore-keys: forge-rf-

      - name: Build debug APK
        working-directory: android-rf-toolbox
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        working-directory: android-rf-toolbox
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "path=android-rf-toolbox/${APK}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: forge-rf-toolbox-debug
          path: ${{ steps.apk.outputs.path }}
          retention-days: 14
