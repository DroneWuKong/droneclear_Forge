name: One-off website analytics readback
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aggregate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retrieve aggregate traffic with existing credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLAR_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANALYTICS_ADMIN_KEY: ${{ secrets.ANALYTICS_ADMIN_KEY }}
        run: python3 tools/website_analytics_readback.py
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-website-analytics
          path: analytics-report.enc
          if-no-files-found: error
          retention-days: 1
