name: One-off website analytics readback
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Aggregate traffic or token policy diagnosis
        type: choice
        default: traffic
        options: [traffic, account, diagnostic, history, rum-history, archives]
permissions:
  contents: read
jobs:
  aggregate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare read-only legacy analytics client
        if: inputs.mode == 'archives'
        run: npm install --prefix "$RUNNER_TEMP/analytics-sdk" --no-audit --no-fund @netlify/blobs@11.1.4
      - name: Retrieve aggregate traffic with existing credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLAR_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANALYTICS_ADMIN_KEY: ${{ secrets.ANALYTICS_ADMIN_KEY }}
          ANALYTICS_REPORT_MODE: ${{ inputs.mode || 'traffic' }}
          NETLIFY_API_TOKEN: ${{ secrets.NETLIFY_API_TOKEN }}
          ANALYTICS_SITE_ID: ${{ secrets.ANALYTICS_SITE_ID }}
          NODE_PATH: ${{ runner.temp }}/analytics-sdk/node_modules
        run: python3 tools/website_analytics_readback.py
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-website-analytics
          path: analytics-report.enc
          if-no-files-found: error
          retention-days: 1
