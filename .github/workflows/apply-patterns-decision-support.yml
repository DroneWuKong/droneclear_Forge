name: Apply Patterns Flag Decision Support

on:
  push:
    branches:
      - feat/pattern-flag-decision-support-20260731
    paths:
      - tools/apply_patterns_decision_support.py
      - forge-source/patterns-decision-support.js
      - tests/test_patterns_decision_support.cjs
      - .github/workflows/apply-patterns-decision-support.yml
  pull_request:
    paths:
      - tools/apply_patterns_decision_support.py
      - forge-source/patterns-decision-support.js
      - tests/test_patterns_decision_support.cjs
      - .github/workflows/apply-patterns-decision-support.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-patterns-decision-support-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply deterministic Patterns patches
        run: python tools/apply_patterns_decision_support.py

      - name: Run complete software-only validation
        run: |
          set -euo pipefail
          node --test tests/test_patterns_decision_support.cjs tests/test_dossier_signals.cjs
          node --check forge-source/patterns-decision-support.js
          node --check forge-source/dossier-signals.js
          python -m py_compile build_static.py tools/audit_public_site.py tests/test_public_site_audit.py
          python -m unittest -v tests/test_public_site_audit.py
          python tools/audit_public_site.py --strict --require-catalog --dry-run
          python build_static.py
          python tools/audit_public_site.py --site-dir build --built --strict --require-catalog --dry-run

      - name: Commit validated non-workflow changes
        run: |
          set -euo pipefail
          rm -f tools/apply_patterns_decision_support.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add forge-source/patterns.html forge-source/patterns-decision-support.js tests/test_patterns_decision_support.cjs tools/apply_patterns_decision_support.py
          git commit -m "feat(patterns): add evidence-grounded flag decision support [skip ci]"
          git pull --rebase origin "${TARGET_BRANCH}"
          git push origin "HEAD:${TARGET_BRANCH}"
