name: Apply local Priority Intelligence View

on:
  push:
    branches:
      - feat/local-priority-intelligence-view-20260731
    paths:
      - "forge-source/priorities.html"
      - "forge-source/pir-priority-view.js"
      - "forge-source/pir_profiles.json"
      - "tests/test_pir_priority_view.cjs"
      - "tools/apply_priority_view_patch.py"
      - ".github/workflows/apply-priority-view.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-priority-view-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/local-priority-intelligence-view-20260731
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply narrow cross-surface edits
        run: python tools/apply_priority_view_patch.py --apply

      - name: Run software-only validation before commit
        run: |
          python -m py_compile tools/apply_priority_view_patch.py
          python tools/apply_priority_view_patch.py --check
          python -m json.tool forge-source/pir_profiles.json >/dev/null
          node --check forge-source/pir-priority-view.js
          node --test tests/test_pir_priority_view.cjs
          node --input-type=module --check < workers/forge-data.js

      - name: Commit final implementation and remove bootstrap workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-priority-view.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No Priority View changes to commit"
            exit 0
          fi
          git commit -m "feat(pir): integrate local Priority Intelligence View"
          git push origin HEAD:feat/local-priority-intelligence-view-20260731
