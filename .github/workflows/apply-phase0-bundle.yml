name: Apply Forge + Patterns Phase 0 Bundle

on:
  push:
    branches:
      - feat/data-quality-and-site-consistency-20260731
    paths:
      - tools/phase0_bundle.part*
      - .github/workflows/apply-phase0-bundle.yml
  pull_request:
    paths:
      - tools/phase0_bundle.part*
      - .github/workflows/apply-phase0-bundle.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-phase0-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Decode target files
        run: |
          set -euo pipefail
          cat tools/phase0_bundle.part* | base64 --decode | tar -xzf -

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Run software-only checks before commit
        run: |
          python -m py_compile tools/audit_public_site.py tests/test_public_site_audit.py
          python -m unittest -v tests/test_public_site_audit.py
          python tools/audit_public_site.py --strict --require-catalog --dry-run
          python - <<'PY'
          import yaml
          from pathlib import Path
          for path in Path('.github/workflows').glob('*.yml'):
              yaml.safe_load(path.read_text())
          print('workflow YAML parse: PASS')
          PY

      - name: Commit decoded bundle and remove bootstrap
        run: |
          set -euo pipefail
          rm -f tools/phase0_bundle.part* .github/workflows/apply-phase0-bundle.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(site): add data quality, trust metadata, and Phase 0 audits"
          git push origin "HEAD:${TARGET_BRANCH}"
