name: Deploy Forge to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      mode:
        description: Deploy the site or inspect partner email readiness
        type: choice
        default: deploy
        options: [deploy, inspect-email, configure-email, assign-reviewer]
      reviewer_email:
        description: Explicitly selected verified publication reviewer (assign-reviewer only)
        type: string
        required: false

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  inspect-email:
    if: github.event_name == 'workflow_dispatch' && inputs.mode != 'deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect production partner email metadata
        if: inputs.mode == 'inspect-email'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLAR_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 tools/inspect_partner_email.py
      - name: Enable partner email sending
        if: inputs.mode == 'configure-email'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLAR_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 tools/inspect_partner_email.py --configure
      - name: Prepare private partner email service without publishing the site
        if: inputs.mode == 'configure-email'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLAR_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 tools/provision_partner_accounts.py
          npx --yes wrangler@4.147.0 deploy --config wrangler.partner-email.jsonc --keep-vars
      - name: Assign the selected verified publication reviewer
        if: inputs.mode == 'assign-reviewer'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLAR_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REVIEWER_EMAIL: ${{ inputs.reviewer_email }}
        run: python3 tools/assign_partner_reviewer.py

  deploy:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'deploy'
    name: Build and deploy production Pages bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require production deployment credentials
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_PAT || secrets.GIT_PAT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLAR_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in GITHUB_PAT CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if test -z "${!name}"; then
              echo "::error title=Missing deployment secret::$name is not configured"
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Build pinned public and private inputs
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_PAT || secrets.GIT_PAT }}
        run: python3 tools/build_pages.py

      - name: Audit gated export, provenance, and current DDG results
        run: python3 tools/audit_private_release.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Provision and inspect Forge policy schema and signing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLAR_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 tools/provision_forge_policy.py

      - name: Provision and verify partner account schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLAR_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 tools/provision_partner_accounts.py

      - name: Deploy partner email sender and catalog import worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLAR_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.147.0 deploy --config wrangler.partner-email.jsonc --keep-vars
          npx --yes wrangler@4.147.0 deploy --config wrangler.ecosystem.jsonc --keep-vars

      - name: Deploy to Cloudflare Pages
        id: deploy_pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLAR_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.147.0"
          command: pages deploy build --project-name=droneclear-forge --branch=master --commit-hash=${{ github.sha }}

      - name: Verify deployed Forge policy readiness
        run: python3 tools/provision_forge_policy.py --verify
