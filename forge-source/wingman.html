<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Wingman AI — Drone Systems Intelligence</title>
<style>
  :root {
    --bg:        #0c0c0a;
    --bg-card:   #1c1c17;
    --bg-input:  #141410;
    --border:    #2e2e26;
    --border-act:#22c55e;
    --cyan:      #22c55e;
    --cyan-dim:  #166534;
    --white:     #f5f0e8;
    --g1:        #b8b0a0;
    --g2:        #6b6358;
    --g3:        #3d3830;
    --g4:        #2e2e26;
    --red:       #d62828;
    --yellow:    #c9a227;
    --sans:      'Inter', system-ui, sans-serif;
    --mono:      'JetBrains Mono', 'Courier New', monospace;
  }
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--white); font-family: var(--sans); font-size: 13px; }

  body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; -webkit-overflow-scrolling: touch; }

  /* ── TOP BAR ── */
  #topbar {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 14px; border-bottom: 1px solid var(--border);
    background: var(--bg); flex-shrink: 0; flex-wrap: wrap;
  }
  #topbar .title { display: flex; align-items: center; gap: 7px; }
  #topbar .title .slash { color: var(--cyan); font-family: var(--mono); font-size: 13px; font-weight: 700; }
  #topbar .title .name { color: var(--white); font-size: 13px; font-weight: 700; letter-spacing: .02em; }
  #topbar .nav-links { display: flex; gap: 2px; margin-left: 4px; }
  #topbar .nav-link {
    font-size: 11px; color: var(--g2); padding: 4px 9px; border-radius: 5px;
    text-decoration: none; transition: all .12s; border: 1px solid transparent;
  }
  #topbar .nav-link:hover { color: var(--g1); border-color: var(--border); }
  #topbar .spacer { flex: 1; }
  #topbar .badges { display: flex; gap: 6px; align-items: center; }

  .badge {
    display: flex; align-items: center; gap: 5px;
    padding: 4px 10px; border-radius: 5px; font-size: 11px; cursor: pointer;
    font-family: var(--sans); border: 1px solid var(--border); background: transparent; color: var(--g2);
    transition: all 0.12s;
  }
  .badge.cyan { border-color: rgba(34,197,94,.25); background: rgba(34,197,94,.07); color: var(--cyan); cursor: default; }
  .badge.gh-ok { border-color: rgba(34,197,94,.35); background: rgba(34,197,94,.06); color: var(--cyan); }
  .badge.gh-err { border-color: rgba(248,113,113,.3); color: var(--red); }
  .badge.gh-loading { border-color: rgba(250,204,21,.3); color: var(--yellow); }
  .badge:hover { border-color: var(--g3); color: var(--g1); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 4px rgba(34,197,94,.6); flex-shrink: 0; }


  .mode-btn.active { background: rgba(34,197,94,.12); color: var(--cyan); font-weight: 700; }

  /* ── SOURCES BAR ── */
  #sources-bar {
    display: flex; gap: 5px; align-items: center; flex-wrap: wrap;
    padding: 6px 14px; border-bottom: 1px solid var(--border);
    background: #0d0d0b; flex-shrink: 0;
  }
  #sources-bar .label { color: var(--g2); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; margin-right: 2px; font-family: var(--mono); }
  /* source pills — dynamic via JS */
  .source-pill {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 10px; font-family: var(--mono); font-weight: 500;
    color: var(--g1); padding: 2px 8px 2px 6px;
    border: 1px solid var(--border); border-radius: 4px;
    transition: all .12s;
  }
  .source-pill::before { content: ''; display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--g3); flex-shrink: 0; }
  .source-pill.live { color: var(--cyan); border-color: rgba(34,197,94,.25); }
  .source-pill.live::before { background: var(--cyan); box-shadow: 0 0 4px rgba(34,197,94,.5); }
  .source-pill[data-src="parts-db"]::before { background: var(--cyan); }
  .source-pill[data-src="handbook"]::before { background: #60a5fa; }
  .source-pill[data-src="intel"]::before { background: #f59e0b; }
  .source-pill[data-src="platforms"]::before { background: #c084fc; }
  .source-pill[data-src="firmware"]::before { background: #f87171; }
  .source-pill.web-pill { color: var(--cyan); border-color: rgba(34,197,94,.25); }
  .source-pill.web-pill::before { background: var(--cyan); box-shadow: 0 0 4px rgba(34,197,94,.5); }
  #sources-spacer { flex: 1; }
  .model-chip {
    font-size: 10px; font-family: var(--mono); color: var(--g2);
    padding: 2px 7px; border: 1px solid var(--border); border-radius: 4px;
    cursor: pointer; transition: all .12s;
  }
  .model-chip:hover { color: var(--g2); border-color: var(--g3); }

  /* ── MESSAGES ── */
  #messages {
    flex: 1; overflow-y: auto; padding: 20px 16px 8px;
    scroll-behavior: smooth;
  }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  #empty-state { max-width: 560px; margin: 0 auto; }
  .welcome-card {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
    overflow: hidden; margin-bottom: 12px;
  }
  .welcome-card .topper { height: 2px; background: linear-gradient(90deg, #22c55e 0%, #3b82f6 60%, #c084fc 100%); }
  .welcome-card .body { padding: 16px 18px 18px; }
  .welcome-card h2 { font-size: 16px; font-weight: 700; color: var(--white); margin-bottom: 6px; font-family: var(--mono); }
  .welcome-card h2 span { color: var(--cyan); }
  .welcome-card p { font-size: 12px; color: var(--g2); line-height: 1.6; }

  .stat-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-bottom: 16px; }
  .stat-card {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 8px; text-align: center; transition: border-color .12s;
  }
  .stat-card:hover { border-color: var(--g3); }
  .stat-card .num { font-size: 17px; font-weight: 700; color: var(--white); line-height: 1; margin-bottom: 3px; font-family: var(--mono); }
  .stat-card .lbl { font-size: 10px; color: var(--g2); letter-spacing: .1em; text-transform: uppercase; line-height: 1.3; }

  .starters-label { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; }
  .starters-label .slash { color: var(--cyan); font-family: var(--mono); font-size: 11px; }
  .starters-label .txt { color: var(--g2); font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
  #starters { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .starter-btn {
    padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg-card); color: var(--g2); cursor: pointer;
    font-family: var(--sans); font-size: 12px; transition: all 0.12s;
    text-align: left; line-height: 1.4;
  }
  .starter-btn:hover { border-color: var(--cyan); color: var(--g1); background: rgba(34,197,94,.05); }

  /* message row */
  .msg-row { margin-bottom: 18px; display: flex; flex-direction: column; }
  .msg-row.user { align-items: flex-end; }
  .msg-row.assistant { align-items: flex-start; }

  .msg-meta {
    display: flex; align-items: center; gap: 6px;
    font-size: 10px; color: var(--g3); letter-spacing: .1em; text-transform: uppercase;
    margin-bottom: 5px;
  }
  .msg-meta .slash { color: var(--cyan); font-family: var(--mono); }
  .web-badge {
    font-size: 10px; color: var(--cyan); border: 1px solid rgba(45,212,191,.3);
    border-radius: 3px; padding: 1px 5px; letter-spacing: .06em;
  }

  .img-previews { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .img-previews img { max-height: 150px; max-width: 210px; border-radius: 6px; border: 1px solid var(--border); object-fit: contain; }

  .bubble {
    max-width: 88%; padding: 11px 15px;
    border: 1px solid var(--border); line-height: 1.65;
  }
  .bubble.user {
    border-radius: 10px 2px 10px 10px;
    background: rgba(26,140,128,.15); border-color: rgba(45,212,191,.25);
    color: var(--g1);
  }
  .bubble.assistant {
    border-radius: 2px 10px 10px 10px;
    background: var(--bg-card);
  }

  /* markdown inside bubble */
  .bubble h1 { font-size: 15px; font-weight: 700; color: var(--white); margin: 14px 0 6px; }
  .bubble h2 { font-size: 11px; font-weight: 700; color: var(--cyan); text-transform: uppercase; letter-spacing: .1em; margin: 12px 0 5px; border-bottom: 1px solid var(--border); padding-bottom: 3px; }
  .bubble h3 { font-size: 13px; font-weight: 600; color: var(--white); margin: 10px 0 4px; }
  .bubble p { margin: 3px 0; color: var(--g1); }
  .bubble ul { list-style: none; padding: 0; margin: 4px 0; }
  .bubble ul li { display: flex; gap: 8px; margin-top: 3px; color: var(--g1); }
  .bubble ul li::before { content: "—"; color: var(--cyan); flex-shrink: 0; }
  .bubble ol { padding-left: 18px; margin: 4px 0; color: var(--g1); }
  .bubble ol li { margin-top: 3px; }
  .bubble code { background: #141410; color: var(--cyan); padding: 1px 6px; border-radius: 4px; font-size: 11px; font-family: var(--mono); border: 1px solid var(--border); }
  .bubble pre { background: #141410; border: 1px solid var(--border); border-radius: 6px; padding: 10px 14px; overflow-x: auto; margin: 8px 0; }
  .bubble pre code { background: none; border: none; padding: 0; font-size: 12px; line-height: 1.6; color: var(--cyan); }
  .bubble strong { color: var(--white); font-weight: 600; }

  /* thinking */
  .thinking {
    display: inline-flex; align-items: center; gap: 10px;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 2px 10px 10px 10px; padding: 10px 16px; margin-bottom: 16px;
  }
  .thinking .dots { display: flex; gap: 5px; }
  .thinking .dots span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--cyan);
    animation: pulse 1.3s ease-in-out infinite;
  }
  .thinking .dots span:nth-child(2) { animation-delay: .2s; }
  .thinking .dots span:nth-child(3) { animation-delay: .4s; }
  .thinking .lbl { font-size: 12px; color: var(--g2); }
  @keyframes pulse { 0%,100%{opacity:.2;transform:scale(.75)} 50%{opacity:1;transform:scale(1.1)} }

  /* ── INPUT AREA ── */
  #input-area {
    padding: 10px 16px calc(env(safe-area-inset-bottom, 0px) + 12px); border-top: 1px solid var(--border);
    background: var(--bg); flex-shrink: 0;
  }
  #staged-images { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .staged-img-wrap { position: relative; }
  .staged-img-wrap img { height: 52px; border-radius: 5px; border: 1px solid var(--border-act); object-fit: contain; }
  .staged-img-wrap .rm {
    position: absolute; top: -5px; right: -5px; width: 16px; height: 16px;
    border-radius: 50%; border: none; background: var(--red); color: #fff;
    font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }

  #input-row { display: flex; gap: 8px; align-items: flex-end; }

  .icon-btn {
    width: 38px; height: 38px; flex-shrink: 0; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg-input);
    color: var(--g3); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.12s;
  }
  .icon-btn:hover, .icon-btn.active { border-color: var(--border-act); color: var(--cyan); background: rgba(45,212,191,.1); }
  .icon-btn svg { pointer-events: none; }

  #text-input {
    flex: 1; resize: none; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg-input);
    color: var(--white); padding: 10px 12px;
    font-family: var(--sans); font-size: 16px; line-height: 1.5;
    outline: none; min-height: 38px; max-height: 120px; overflow-y: auto;
    transition: border-color 0.12s;
    -webkit-appearance: none; appearance: none;
    touch-action: manipulation;
  }
  #text-input:focus { border-color: var(--border-act); }
  #text-input::placeholder { color: var(--g3); }

  #send-btn {
    width: 44px; height: 44px; flex-shrink: 0; border-radius: 6px;
    border: none; background: var(--cyan); color: #0c0c0a;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.12s; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  #send-btn:active { transform: scale(0.92); opacity: 0.8; }
  #send-btn svg { pointer-events: none; }

  #input-hint { margin-top: 8px; text-align: center; font-size: 10px; color: var(--g4); letter-spacing: .06em; }

  /* feedback buttons */
  .msg-feedback { display: flex; gap: 4px; margin-top: 4px; align-items: center; }
  .fb-btn { background: none; border: 1px solid transparent; border-radius: 4px; padding: 2px 6px; cursor: pointer; font-size: 12px; color: var(--g3); transition: all .15s; font-family: var(--sans); display: flex; align-items: center; gap: 3px; }
  .fb-btn:hover { border-color: var(--border); color: var(--g1); }
  .fb-btn.active { border-color: var(--cyan); color: var(--cyan); }
  .fb-btn.fb-save { font-size: 11px; color: var(--g3); }
  .fb-btn.fb-save:hover { color: var(--cyan); border-color: var(--cyan); }
  .fb-btn.fb-save.saved { color: var(--cyan); border-color: var(--cyan); }
  
  /* issue tracker badge */
  .issue-count { position: fixed; bottom: 80px; right: 16px; background: var(--cyan); color: #0c0c0a; border-radius: 12px; padding: 4px 10px; font-size: 11px; font-weight: 700; cursor: pointer; z-index: 50; display: none; font-family: var(--sans); box-shadow: 0 2px 8px rgba(0,0,0,.3); }
  .issue-count:hover { transform: scale(1.05); }
  .issue-count.visible { display: block; }
  
  /* issue panel */
  .issue-panel { display: none; position: fixed; bottom: 110px; right: 16px; width: 340px; max-height: 400px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; z-index: 50; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,.4); }
  .issue-panel.open { display: flex; flex-direction: column; }
  .issue-panel-hdr { padding: 10px 14px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .issue-panel-hdr h4 { font-size: 13px; color: var(--white); margin: 0; font-weight: 600; }
  .issue-panel-body { flex: 1; overflow-y: auto; padding: 8px; max-height: 300px; }
  .issue-item { padding: 8px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 6px; font-size: 11px; cursor: default; }
  .issue-item-title { color: var(--white); font-weight: 600; margin-bottom: 3px; }
  .issue-item-meta { color: var(--g3); font-size: 10px; }
  .issue-item-actions { display: flex; gap: 4px; margin-top: 6px; }
  .issue-item-actions button { font-size: 10px; padding: 2px 8px; border-radius: 3px; border: 1px solid var(--border); background: none; color: var(--g2); cursor: pointer; font-family: var(--sans); }
  .issue-item-actions button:hover { border-color: var(--cyan); color: var(--cyan); }
  .issue-panel-footer { padding: 8px 14px; border-top: 1px solid var(--border); display: flex; gap: 6px; }
  .issue-panel-footer button { flex: 1; padding: 6px; border-radius: 4px; border: 1px solid var(--border); background: none; color: var(--g2); cursor: pointer; font-size: 11px; font-family: var(--sans); }
  .issue-panel-footer button:hover { border-color: var(--cyan); color: var(--cyan); }
  .issue-panel-footer button.primary { background: var(--cyan); color: #0c0c0a; border-color: var(--cyan); font-weight: 600; }
  .issue-panel-footer button.primary:hover { opacity: .85; }

  /* ── MOBILE ── */
  @media (max-width: 600px) {
    #topbar { padding: 8px 12px; gap: 5px; }
    #topbar .nav-links { display: none; }
    #sources-bar { padding: 5px 12px; }
    #messages { padding: 14px 12px 6px; }
    #input-area { padding: 8px 12px calc(env(safe-area-inset-bottom, 0px) + 8px); }
    #input-hint { display: none; }
    .welcome-card .body { padding: 12px 14px 14px; }
    .welcome-card h2 { font-size: 14px; }
    .stat-grid { grid-template-columns: repeat(3, 1fr); gap: 4px; }
    .stat-card { padding: 8px 5px; }
    .stat-card .num { font-size: 15px; }
    #starters { grid-template-columns: 1fr; }
  }

  /* ── GAP ANALYZER PANEL ── */
  #gap-panel {
    display: none; position: fixed; top: 0; right: 0; bottom: 0;
    width: 360px; background: var(--bg-card); border-left: 1px solid var(--border);
    z-index: 150; flex-direction: column; box-shadow: -4px 0 24px rgba(0,0,0,.5);
  }
  #gap-panel.open { display: flex; }
  #gap-hdr {
    padding: 11px 14px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
  }
  #gap-hdr .title { font: 700 12px var(--mono); color: var(--cyan); letter-spacing: .06em; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
  #gap-hdr .close { background: none; border: none; color: var(--g2); cursor: pointer; font-size: 18px; line-height: 1; padding: 0; }
  #gap-hdr .close:hover { color: var(--white); }
  #gap-inputs { padding: 12px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  #gap-inputs label { font: 600 9px var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--g2); display: block; margin-bottom: 4px; }
  .gap-input-row { display: flex; gap: 6px; margin-bottom: 8px; }
  .gap-field {
    flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
    padding: 6px 9px; color: var(--white); font: 12px var(--sans); outline: none;
    transition: border-color .15s;
  }
  .gap-field:focus { border-color: var(--cyan); }
  .gap-field::placeholder { color: var(--g3); }
  #gap-run {
    width: 100%; padding: 7px; border-radius: 5px; border: 1px solid var(--cyan);
    background: rgba(34,197,94,.1); color: var(--cyan); font: 600 11px var(--sans);
    cursor: pointer; transition: all .15s; letter-spacing: .03em;
  }
  #gap-run:hover { background: rgba(34,197,94,.2); }
  #gap-run:disabled { opacity: .4; cursor: default; }
  #gap-auto-hint { font: 500 10px var(--sans); color: var(--g2); margin-top: 6px; display: none; }
  #gap-auto-hint.visible { display: block; }
  #gap-body { flex: 1; overflow-y: auto; padding: 10px 14px; }
  .gap-empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; color: var(--g3); font: 500 11px var(--sans); text-align: center; gap: 8px;
  }
  .gap-empty i { font-size: 28px; }
  .gap-section-lbl { font: 600 9px var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--g2); margin: 12px 0 6px; display: flex; align-items: center; gap: 6px; }
  .gap-section-lbl::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .gap-card {
    border: 1px solid var(--border); border-radius: 6px; padding: 9px 11px;
    margin-bottom: 6px; font-size: 11px; line-height: 1.5;
  }
  .gap-card.critical { border-color: rgba(214,40,40,.4); background: rgba(214,40,40,.05); }
  .gap-card.warning  { border-color: rgba(201,162,39,.35); background: rgba(201,162,39,.04); }
  .gap-card.info     { border-color: rgba(34,197,94,.25); background: rgba(34,197,94,.03); }
  .gap-card-title { font: 600 11px var(--sans); color: var(--white); margin-bottom: 3px; display: flex; align-items: center; gap: 6px; }
  .gap-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .gap-dot.critical { background: var(--red); }
  .gap-dot.warning  { background: var(--yellow); }
  .gap-dot.info     { background: var(--cyan); }
  .gap-card-body { color: var(--g1); }
  .gap-card-body strong { color: var(--white); }
  .gap-thinking { display: flex; align-items: center; gap: 8px; color: var(--g2); font: 500 11px var(--sans); padding: 12px 0; }
  .gap-thinking .dots { display: flex; gap: 4px; }
  .gap-thinking .dots span { width: 4px; height: 4px; border-radius: 50%; background: var(--cyan); animation: gapPulse 1.2s ease-in-out infinite; }
  .gap-thinking .dots span:nth-child(2) { animation-delay: .2s; }
  .gap-thinking .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes gapPulse { 0%,80%,100%{opacity:.2} 40%{opacity:1} }
  #gap-panel .gap-cta { font: 500 10px var(--sans); color: var(--g2); margin-top: 10px; text-align: center; }
  #gap-panel .gap-cta a { color: var(--cyan); text-decoration: none; }
  @media (max-width: 600px) {
    #gap-panel { width: 100%; border-left: none; }
  }

  /* ── CONFIG MODAL ── */
  #cfg-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.75);
    z-index: 200; align-items: center; justify-content: center;
  }
  #cfg-overlay.open { display: flex; }
  #cfg-panel {
