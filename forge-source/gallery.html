<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Featured Builds — Forge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0c0c0a;color:#b8b0a0;font-family:'DM Sans',system-ui,sans-serif;min-height:100vh}
.gallery-header{max-width:1200px;margin:0 auto;padding:40px 20px 20px}
.gallery-header h1{font:700 28px 'JetBrains Mono',monospace;color:#f59e0b;margin-bottom:8px}
.gallery-header p{font-size:14px;color:#6b6358;max-width:600px}
.filter-bar{max-width:1200px;margin:0 auto;padding:8px 20px 16px;display:flex;gap:8px;flex-wrap:wrap}
.filter-pill{padding:6px 14px;border-radius:20px;border:1px solid #2a2a22;background:none;color:#6b6358;font:500 11px 'DM Sans',system-ui;cursor:pointer;transition:all .15s}
.filter-pill:hover{border-color:#3e3e34;color:#b8b0a0}
.filter-pill.active{border-color:#f59e0b;color:#f59e0b;background:rgba(245,158,11,.08)}
.grid{max-width:1200px;margin:0 auto;padding:0 20px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.card{background:#111110;border:1px solid #2a2a22;border-radius:10px;padding:20px;transition:all .2s;display:flex;flex-direction:column}
.card:hover{border-color:#3e3e34;transform:translateY(-2px)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.card-name{font:700 15px 'DM Sans',system-ui;color:#e8e0d4}
.badge{padding:3px 8px;border-radius:4px;font:600 10px 'JetBrains Mono',monospace;text-transform:uppercase}
.badge-beginner{background:rgba(34,197,94,.12);color:#22c55e}
.badge-intermediate{background:rgba(245,158,11,.12);color:#f59e0b}
.badge-advanced{background:rgba(220,38,38,.12);color:#dc2626}
.badge-ndaa{background:rgba(59,130,246,.12);color:#3b82f6}
.card-desc{font-size:12px;color:#6b6358;line-height:1.5;margin-bottom:14px;flex:1}
.card-specs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px}
.spec{font:400 11px 'JetBrains Mono',monospace;color:#4a4540}
.spec b{color:#6b6358;font-weight:500}
.card-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:14px}
.tag{padding:2px 8px;border-radius:3px;font:400 10px 'JetBrains Mono',monospace;background:#1a1a14;color:#4a4540}
.card-footer{display:flex;justify-content:space-between;align-items:center;padding-top:12px;border-top:1px solid #1e1e18}
.cost{font:600 13px 'JetBrains Mono',monospace;color:#f59e0b}
.btn-build{padding:7px 16px;border-radius:6px;border:1px solid #dc2626;background:rgba(220,38,38,.08);color:#dc2626;font:600 11px 'DM Sans',system-ui;cursor:pointer;text-decoration:none;transition:all .15s}
.btn-build:hover{background:#dc2626;color:#fff}
@media(max-width:640px){.grid{grid-template-columns:1fr}.card-specs{grid-template-columns:1fr}}
.screening-status,.screening-records{font-size:13px;line-height:1.5;color:#e8e0d4;overflow-wrap:anywhere}.screening-records li{margin-bottom:8px}.screening-records a{color:#fbbf24}.card-footer{flex-wrap:wrap}
</style>
</head>
<body>
<main id="main-content">

<div class="gallery-header">
  <h1>Featured Builds</h1>
  <p>Unvalidated example component lists for exploring the catalog. Some lists are incomplete and selected records may conflict. They are not tested aircraft configurations or procurement approvals. Inspect each source and the exact configuration before building.</p>
</div>

<div class="filter-bar">
  <button class="filter-pill active" data-cat="all">All</button>
  <button class="filter-pill" data-cat="freestyle">Freestyle</button>
  <button class="filter-pill" data-cat="longrange">Long Range</button>
  <button class="filter-pill" data-cat="cinelifter">Cinelifter</button>
  <button class="filter-pill" data-cat="defense">Defense examples</button>
  <button class="filter-pill" data-cat="racing">Racing</button>
  <button class="filter-pill" data-cat="beginner">Beginner</button>
  <button class="filter-pill" data-cat="cinema">Cinema</button>
</div>

<div class="grid" id="builds-grid"></div>

<script src="/static/catalog-screening.js"></script>
<script>
// PIDs reference real parts from forge_database.json
// Builder deep-links use ?b=<base64url(JSON.stringify(pids))> — matches encodeBuildParam() in index.html
var BUILDS = [
  {
    name: "TBS Source One Freestyle Example",
    cat: "freestyle", difficulty: "intermediate",
    desc: "Source One frame, Lucid Freestyle stack, Grinder motors, Crossfire receiver and battery. Selected rows only; compatibility and performance are not validated.",
    tags: ["example","tbs","freestyle","crossfire","6s"],
    pids: ["FRM-1005","STK-1010","MTR-1025","MTR-1025","MTR-1025","MTR-1025","RCV-1014","BAT-1000"],
    b: "WyJGUk0tMTAwNSIsICJTVEstMTAxMCIsICJNVFItMTAyNSIsICJNVFItMTAyNSIsICJNVFItMTAyNSIsICJNVFItMTAyNSIsICJSQ1YtMTAxNCIsICJCQVQtMTAwMCJd"
  },
  {
    name: "Lumenier QAV-S 2 Beginner Example",
    cat: "beginner", difficulty: "beginner",
    desc: "QAV-S bundle, XILO stack, motors, ELRS receiver and battery. The selected receiver conflicts with the former whole-build compliance label; inspect the recorded flags below.",
    tags: ["beginner","example","elrs","lumenier","bundle"],
    pids: ["FRM-1008","STK-1028","MTR-1026","MTR-1026","MTR-1026","MTR-1026","RCV-1016","BAT-1001"],
    b: "WyJGUk0tMTAwOCIsICJTVEstMTAyOCIsICJNVFItMTAyNiIsICJNVFItMTAyNiIsICJNVFItMTAyNiIsICJNVFItMTAyNiIsICJSQ1YtMTAxNiIsICJCQVQtMTAwMSJd"
  },
  {
    name: "Lumenier Cinema Component Example",
    cat: "cinema", difficulty: "advanced",
    desc: "Lumenier frame, flight controller, motors, ESC, receiver and battery. Frame and propeller size require source verification; this list has not been validated as a 7-inch configuration.",
    tags: ["cinema","example","lumenier","lipo-ion","smooth"],
    pids: ["FRM-1012","FC-1009","MTR-1040","MTR-1040","MTR-1040","MTR-1040","ESC-1004","RCV-1005","BAT-1002"],
    b: "WyJGUk0tMTAxMiIsICJGQy0xMDA5IiwgIk1UUi0xMDQwIiwgIk1UUi0xMDQwIiwgIk1UUi0xMDQwIiwgIk1UUi0xMDQwIiwgIkVTQy0xMDA0IiwgIlJDVi0xMDA1IiwgIkJBVC0xMDAyIl0"
  },
  {
    name: "Orqa + CubePilot Component Example",
    cat: "defense", difficulty: "advanced",
    desc: "Orqa flight controller, Herelink air unit, motors, ESC, receiver and battery. This selected component list is incomplete and has no whole-aircraft approval evidence.",
    tags: ["example","isr","herelink","orqa","cubepilot","encrypted"],
    pids: ["FC-1008","VTX-1001","MTR-1006","MTR-1006","MTR-1006","MTR-1006","ESC-1003","RCV-1047","BAT-1004"],
    b: "WyJGQy0xMDA4IiwgIlZUWC0xMDAxIiwgIk1UUi0xMDA2IiwgIk1UUi0xMDA2IiwgIk1UUi0xMDA2IiwgIk1UUi0xMDA2IiwgIkVTQy0xMDAzIiwgIlJDVi0xMDQ3IiwgIkJBVC0xMDA0Il0"
  },
  {
    name: "Lumenier Long-Range Component Example",
    cat: "longrange", difficulty: "advanced",
    desc: "Flight controller, ESC, motors, receiver and battery. This list does not establish endurance, radio range or a complete airframe configuration.",
    tags: ["example","long-range","lumenier","ghost","lipo-ion"],
    pids: ["FC-1009","ESC-1004","MTR-1040","MTR-1040","MTR-1040","MTR-1040","RCV-1005","BAT-1002"],
    b: "WyJGQy0xMDA5IiwgIkVTQy0xMDA0IiwgIk1UUi0xMDQwIiwgIk1UUi0xMDQwIiwgIk1UUi0xMDQwIiwgIk1UUi0xMDQwIiwgIlJDVi0xMDA1IiwgIkJBVC0xMDAyIl0"
  },
  {
    name: "TBS Lucid Pro Racing Example",
    cat: "racing", difficulty: "advanced",
    desc: "Source One frame, Lucid Pro stack, Grinder motors, Crossfire receiver and battery. This selected component list has no documented aircraft performance or approval.",
    tags: ["example","racing","tbs","am32","crossfire"],
    pids: ["FRM-1005","STK-1009","MTR-1025","MTR-1025","MTR-1025","MTR-1025","RCV-1029","BAT-1000"],
    b: "WyJGUk0tMTAwNSIsICJTVEstMTAwOSIsICJNVFItMTAyNSIsICJNVFItMTAyNSIsICJNVFItMTAyNSIsICJNVFItMTAyNSIsICJSQ1YtMTAyOSIsICJCQVQtMTAwMCJd"
  },
  {
    name: "NewBeeDrone Component Example",
    cat: "freestyle", difficulty: "intermediate",
    desc: "NewBeeDrone stack, Lumenier motors, Crossfire receiver and battery. Recorded battery weights conflict; the former sub-250g claim is unsupported by the selected parts.",
    tags: ["example","micro","3-inch","elrs","indoor"],
    pids: ["STK-1025","MTR-1021","MTR-1021","MTR-1021","MTR-1021","RCV-1014","BAT-1001"],
    b: "WyJTVEstMTAyNSIsICJNVFItMTAyMSIsICJNVFItMTAyMSIsICJNVFItMTAyMSIsICJNVFItMTAyMSIsICJSQ1YtMTAxNCIsICJCQVQtMTAwMSJd"
  },
  {
    name: "Lumenier Cinelifter Component Example",
    cat: "cinelifter", difficulty: "advanced",
    desc: "QAV-PRO frame, flight stack, cinematic motors, Ghost receiver and battery. This list has no documented complete-aircraft weight, payload or performance test.",
    tags: ["example","cinelifter","lumenier","payload","ghost"],
    pids: ["FRM-1019","STK-1076","MTR-1008","MTR-1008","MTR-1008","MTR-1008","RCV-1005","BAT-1004"],
    b: "WyJGUk0tMTAxOSIsICJTVEstMTA3NiIsICJNVFItMTAwOCIsICJNVFItMTAwOCIsICJNVFItMTAwOCIsICJNVFItMTAwOCIsICJSQ1YtMTAwNSIsICJCQVQtMTAwNCJd"
  }
];

var galleryCatalog = null;
var galleryCatalogState = 'loading';
var selectedCategory = 'all';
function esc(value) { return String(value == null ? '' : value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
function screeningHtml(build) {
  if (!galleryCatalog) return '<p class="screening-status">' + (galleryCatalogState === 'loading' ? 'Loading recorded component flags…' : 'Component flags unavailable. No configuration approval established.') + '</p>';
  var summary = window.CatalogScreening.summarize(build.pids, galleryCatalog.components);
  var status = 'Recorded NDAA component flags: ' + summary.recordedTrue + ' true, ' + summary.recordedFalse + ' false, ' + summary.unknown + ' not documented or conflicting. These flags do not approve the aircraft configuration.';
  var records = summary.rows.map(function(row) {
    var evidence = row.source ? '<a href="' + esc(row.source) + '" target="_blank" rel="noopener noreferrer">Record source</a>' : 'Source not documented';
    var date = row.verifiedAt ? 'Recorded verification date: ' + esc(row.verifiedAt) : 'Verification date not documented';
    return '<li>' + esc(row.pid) + ': ' + esc(row.record ? row.record.name : 'Record missing') + ' — NDAA flag: ' + (row.ndaa === true ? 'recorded true' : row.ndaa === false ? 'recorded false' : 'not documented / conflicting') + '<br>' + evidence + ' · ' + date + '</li>';
  }).join('');
  return '<p class="screening-status">' + esc(status) + '</p><details class="screening-records"><summary>Inspect selected records and sources</summary><ul>' + records + '</ul></details>';
}
function render(cat) {
  selectedCategory = cat;
  var g = document.getElementById('builds-grid');
  g.innerHTML = '';
  BUILDS.forEach(function(b) {
    if (cat !== 'all' && b.cat !== cat) return;
    var tagHtml = b.tags.map(function(t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('');
    var dc = b.difficulty === 'beginner' ? 'badge-beginner' : b.difficulty === 'intermediate' ? 'badge-intermediate' : 'badge-advanced';
    var partCount = b.pids ? '<span>' + b.pids.length + ' selected component rows · incomplete example</span>' : '';
    g.innerHTML += '<div class="card" data-cat="' + esc(b.cat) + '">' +
      '<div class="card-top"><div class="card-name">' + esc(b.name) + '</div><div><span class="badge ' + dc + '">' + esc(b.difficulty) + '</span></div></div>' +
      '<div class="card-desc">' + esc(b.desc) + '</div>' +
      screeningHtml(b) +
      '<div class="card-tags">' + tagHtml + '</div>' +
      '<div class="card-footer">' + partCount +
      '<a class="btn-build" href="/builder/?b=' + esc(b.b) + '">Inspect in Builder →</a></div></div>';
  });
}
async function loadGalleryCatalog() {
  try {
    var response = await fetch('/static/forge_database.json');
    if (!response.ok) throw new Error('Catalog unavailable');
    var db = await response.json();
    if (!db || !db.components || typeof db.components !== 'object' || Array.isArray(db.components)) throw new Error('Catalog invalid');
    galleryCatalog = db;
    galleryCatalogState = 'loaded';
  } catch (_) { galleryCatalogState = 'unavailable'; }
  render(selectedCategory);
}

document.querySelectorAll('.filter-pill').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.filter-pill').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    render(btn.dataset.cat);
  });
});

render('all');
loadGalleryCatalog();
</script>
</main>
</body>
</html>
