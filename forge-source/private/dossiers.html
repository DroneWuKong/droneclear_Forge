<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Intel Dossiers — PRIVATE — DroneWuKong</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=DM+Sans:wght@400;500;600;700&family=Barlow+Condensed:wght@700;900&display=swap');
  :root{
    --bg:#0c0c0a; --bg2:#141410; --bg3:#1c1c18; --border:#2a2a22; --border2:#222218;
    --green:#22c55e; --green-dim:#166534; --amber:#c9a227; --red:#d62828; --blue:#4a9eff;
    --grey:#5e5a50; --text:#d8d4ca; --text-dim:#b0a898; --text-d2:#7a7268;
    --mono:'JetBrains Mono',monospace; --head:'Barlow Condensed',sans-serif; --body:'DM Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:14px;line-height:1.6;min-height:100vh}
  body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.04) 2px,rgba(0,0,0,.04) 4px);pointer-events:none;z-index:1000}
  nav{position:sticky;top:0;z-index:100;background:rgba(12,12,10,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);height:48px;display:flex;align-items:center;padding:0 20px}
  .nav-inner{display:flex;align-items:center;gap:12px;width:100%;max-width:1400px;margin:0 auto}
  .nav-logo{font:700 15px var(--mono);color:var(--green);text-decoration:none;white-space:nowrap}
  .nav-pills{display:flex;gap:4px;margin-left:auto}
  .nav-pill{font:500 11px var(--body);color:var(--text-d2);padding:3px 10px;border-radius:4px;text-decoration:none}
  .nav-pill:hover{color:var(--text);background:var(--bg3)}
  .nav-pill.active{color:var(--green);background:var(--bg3)}
  .gate-badge{font:600 10px var(--mono);color:var(--red);border:1px solid var(--red);border-radius:3px;padding:2px 6px;letter-spacing:.05em}
  .wrap{max-width:1400px;margin:0 auto;padding:18px 20px 80px}
  header.page{border-left:3px solid var(--green);padding:6px 0 6px 14px;margin-bottom:18px}
  header.page h1{font:900 30px/1 var(--head);letter-spacing:.5px;text-transform:uppercase}
  header.page .sub{font:400 12px var(--mono);color:var(--text-d2);margin-top:6px}
  .layout{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
  @media(max-width:860px){.layout{grid-template-columns:1fr}}
  .sidebar{background:var(--bg2);border:1px solid var(--border);border-radius:6px;position:sticky;top:62px;max-height:calc(100vh - 80px);overflow:auto}
  .side-search{padding:10px;border-bottom:1px solid var(--border)}
  .side-search input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font:400 12px var(--mono);padding:7px 9px}
  .side-group{font:700 10px var(--mono);color:var(--text-d2);letter-spacing:.08em;text-transform:uppercase;padding:12px 12px 4px}
  .doc-link{display:block;padding:6px 12px;font:500 13px var(--body);color:var(--text-dim);text-decoration:none;border-left:2px solid transparent;cursor:pointer}
  .doc-link:hover{background:var(--bg3);color:var(--text)}
  .doc-link.active{border-left-color:var(--green);color:var(--green);background:var(--bg3)}
  .doc-link .hook{display:block;font:400 11px var(--body);color:var(--text-d2);margin-top:1px}
  .reader{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:26px 30px;min-height:60vh;overflow:auto}
  .reader h1{font:900 26px/1.1 var(--head);text-transform:uppercase;margin:2px 0 10px;color:#fff}
  .reader h2{font:700 17px var(--head);text-transform:uppercase;letter-spacing:.4px;color:var(--green);margin:22px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--border)}
  .reader h3{font:700 14px var(--mono);color:var(--amber);margin:16px 0 6px}
  .reader p,.reader li{font-size:13.5px;color:var(--text-dim);margin:6px 0}
  .reader em{color:var(--text-d2)}
  .reader strong{color:var(--text)}
  .reader code{font:600 12px var(--mono);background:var(--bg3);padding:1px 5px;border-radius:3px;color:var(--amber)}
  .reader a{color:var(--blue);text-decoration:none}.reader a:hover{text-decoration:underline}
  .reader blockquote{border-left:3px solid var(--amber);background:var(--bg3);padding:8px 14px;margin:10px 0;color:var(--text-dim);font-size:13px}
  .reader table{border-collapse:collapse;width:100%;margin:12px 0;font-size:12.5px}
  .reader th,.reader td{border:1px solid var(--border);padding:6px 9px;text-align:left;vertical-align:top}
  .reader th{background:var(--bg3);color:var(--text);font:700 11px var(--mono);text-transform:uppercase}
  .reader hr{border:0;border-top:1px solid var(--border);margin:18px 0}
  .conf{font:700 10px var(--mono);padding:0 4px;border-radius:3px}
  .c-C{color:var(--green)} .c-I{color:var(--amber)} .c-S{color:#e08a3c} .c-U{color:var(--red)}
  .muted{color:var(--text-d2);font:400 12px var(--mono)}
  #status{padding:40px;text-align:center;color:var(--text-d2);font:400 13px var(--mono)}
</style>
</head>
<body>
<nav><div class="nav-inner">
  <a class="nav-logo" href="/private/">DRONEWUKONG // INTEL</a>
  <span class="gate-badge">● PRIVATE</span>
  <div class="nav-pills">
    <a class="nav-pill" href="/private/ddg/">DDG Tracker</a>
    <a class="nav-pill active" href="/private/dossiers/">Dossiers</a>
    <a class="nav-pill" href="/private/supply-web/">Supply Web</a>
  </div>
</div></nav>

<div class="wrap">
  <header class="page">
    <h1>Intel Dossiers</h1>
    <div class="sub">OSINT supply-chain &amp; ownership profiles · confidence-tagged · <span class="muted">internal — do not distribute</span></div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="side-search"><input id="q" type="text" placeholder="filter dossiers…" autocomplete="off"></div>
      <div id="nav-list"></div>
    </aside>
    <main class="reader" id="reader">
      <div id="status">loading dossier index…</div>
    </main>
  </div>
</div>

<script>
// Confidence legend: [C]/[I]/[S]/UNKNOWN. Minimal, dependency-free markdown renderer
// (headings, tables, lists, blockquotes, code, bold/italic, links). Content is
// served only from the gated /private/ path.
const BASE='/private/dossiers/';
let INDEX=[];

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function inline(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,(m,x)=>'<code>'+x+'</code>');
  s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,(m,t,u)=>'<a href="'+u+'" target="_blank" rel="noopener">'+t+'</a>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>');
  // confidence tag coloring
  s=s.replace(/\[C\]/g,'<span class="conf c-C">[C]</span>').replace(/\[I\]/g,'<span class="conf c-I">[I]</span>')
     .replace(/\[S\]/g,'<span class="conf c-S">[S]</span>').replace(/UNKNOWN/g,'<span class="conf c-U">UNKNOWN</span>');
  return s;
}
function mdToHtml(md){
  const lines=md.replace(/\r/g,'').split('\n');
  let out=[],i=0;
  while(i<lines.length){
    let ln=lines[i];
    if(/^<!--/.test(ln)){while(i<lines.length&&!/-->/.test(lines[i]))i++;i++;continue;}
    if(/^\s*$/.test(ln)){i++;continue;}
    let h=ln.match(/^(#{1,4})\s+(.*)/);
    if(h){out.push('<h'+h[1].length+'>'+inline(h[2])+'</h'+h[1].length+'>');i++;continue;}
    if(/^\s*>/.test(ln)){let b=[];while(i<lines.length&&/^\s*>/.test(lines[i])){b.push(lines[i].replace(/^\s*>\s?/,''));i++;}out.push('<blockquote>'+inline(b.join(' '))+'</blockquote>');continue;}
    if(/^\s*\|.*\|/.test(ln)){
      let rows=[];while(i<lines.length&&/^\s*\|/.test(lines[i])){rows.push(lines[i]);i++;}
      let cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      let head=cells(rows[0]);let body=rows.slice(2);
      let t='<table><thead><tr>'+head.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>';
      body.forEach(r=>{t+='<tr>'+cells(r).map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>';});
      out.push(t+'</tbody></table>');continue;
    }
    if(/^\s*([-*]|\d+\.)\s+/.test(ln)){let items=[];let ol=/^\s*\d+\./.test(ln);while(i<lines.length&&/^\s*([-*]|\d+\.)\s+/.test(lines[i])){items.push(lines[i].replace(/^\s*([-*]|\d+\.)\s+/,''));i++;}out.push('<'+(ol?'ol':'ul')+'>'+items.map(x=>'<li>'+inline(x)+'</li>').join('')+'</'+(ol?'ol':'ul')+'>');continue;}
    if(/^---+$/.test(ln)){out.push('<hr>');i++;continue;}
    let p=[ln];i++;while(i<lines.length&&!/^\s*$/.test(lines[i])&&!/^(#|>|\||\s*[-*]\s|\s*\d+\.\s|---)/.test(lines[i])){p.push(lines[i]);i++;}
    out.push('<p>'+inline(p.join(' '))+'</p>');
  }
  return out.join('\n');
}
async function loadDoc(slug){
  document.querySelectorAll('.doc-link').forEach(a=>a.classList.toggle('active',a.dataset.slug===slug));
  const r=document.getElementById('reader');r.innerHTML='<div id="status">loading…</div>';
  try{
    const res=await fetch(BASE+slug+'.md',{cache:'no-store'});
    if(!res.ok)throw new Error(res.status);
    r.innerHTML=mdToHtml(await res.text());r.scrollTop=0;
    history.replaceState(null,'','#'+slug);
  }catch(e){r.innerHTML='<div id="status">could not load dossier ('+e.message+'). If you see 403, the private gate is active — sign in via Cloudflare Access.</div>';}
}
function renderNav(filter){
  const f=(filter||'').toLowerCase();
  const groups={};
  INDEX.filter(d=>!f||(d.title+' '+(d.hook||'')).toLowerCase().includes(f)).forEach(d=>{(groups[d.group||'Profiles']=groups[d.group||'Profiles']||[]).push(d);});
  let h='';
  Object.keys(groups).forEach(g=>{h+='<div class="side-group">'+esc(g)+'</div>';groups[g].forEach(d=>{h+='<a class="doc-link" data-slug="'+d.slug+'" onclick="loadDoc(\''+d.slug+'\')">'+esc(d.title)+(d.hook?'<span class="hook">'+esc(d.hook)+'</span>':'')+'</a>';});});
  document.getElementById('nav-list').innerHTML=h||'<div class="side-group">no matches</div>';
}
(async function(){
  try{
    const res=await fetch(BASE+'index.json',{cache:'no-store'});
    if(!res.ok)throw new Error(res.status);
    INDEX=await res.json();
    renderNav('');
    const slug=location.hash.replace('#','')||(INDEX[0]&&INDEX[0].slug);
    if(slug)loadDoc(slug);
    document.getElementById('q').addEventListener('input',e=>renderNav(e.target.value));
  }catch(e){
    document.getElementById('status').innerHTML='dossier index unavailable ('+e.message+').<br>If 403: the private gate is active — authenticate via Cloudflare Access. If 404: run the build with GITHUB_PAT set to pull dossiers from Ai-Project.';
  }
})();
</script>
</body>
</html>
