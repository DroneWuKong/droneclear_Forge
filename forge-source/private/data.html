<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Intel Data — PRIVATE — DroneWuKong</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=DM+Sans:wght@400;600;700&family=Barlow+Condensed:wght@700;900&display=swap');
:root{--bg:#0c0c0a;--bg2:#141410;--bg3:#1c1c18;--border:#2a2a22;--green:#22c55e;--amber:#c9a227;--blue:#4a9eff;--red:#d62828;--text:#d8d4ca;--text-dim:#b0a898;--text-d2:#7a7268;--mono:'JetBrains Mono',monospace;--head:'Barlow Condensed',sans-serif;--body:'DM Sans',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:14px;line-height:1.6;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.04) 2px,rgba(0,0,0,.04) 4px);pointer-events:none;z-index:1000}
nav{position:sticky;top:0;z-index:100;background:rgba(12,12,10,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);height:48px;display:flex;align-items:center;padding:0 20px}
.nav-inner{display:flex;align-items:center;gap:12px;width:100%;max-width:1400px;margin:0 auto}
.nav-logo{font:700 15px var(--mono);color:var(--green);text-decoration:none;white-space:nowrap}
.nav-pills{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav-pill{font:500 11px var(--body);color:var(--text-d2);padding:3px 10px;border-radius:4px;text-decoration:none}
.nav-pill:hover{color:var(--text);background:var(--bg3)}
.nav-pill.active{color:var(--green);background:var(--bg3)}
.gate-badge{font:600 10px var(--mono);color:var(--red);border:1px solid var(--red);border-radius:3px;padding:2px 6px;letter-spacing:.05em}
.wrap{max-width:1400px;margin:0 auto;padding:18px 20px 80px}
header.page{border-left:3px solid var(--green);padding:6px 0 6px 14px;margin-bottom:18px}
header.page h1{font:900 30px/1 var(--head);letter-spacing:.5px;text-transform:uppercase}
header.page .sub{font:400 12px var(--mono);color:var(--text-d2);margin-top:6px}
.layout{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
@media(max-width:860px){.layout{grid-template-columns:1fr}}
.sidebar{background:var(--bg2);border:1px solid var(--border);border-radius:6px;position:sticky;top:62px;max-height:calc(100vh - 80px);overflow:auto}
.ds-link{display:block;padding:9px 12px;border-left:2px solid transparent;cursor:pointer;border-bottom:1px solid var(--border2,#1c1c18)}
.ds-link:hover{background:var(--bg3)}
.ds-link.active{border-left-color:var(--green);background:var(--bg3)}
.ds-link .t{font:600 13px var(--body);color:var(--text)}
.ds-link.active .t{color:var(--green)}
.ds-link .d{font:400 11px var(--body);color:var(--text-d2);margin-top:2px}
.ds-link .sz{font:600 10px var(--mono);color:var(--text-d2)}
.reader{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:18px 20px;min-height:60vh;overflow:auto}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tools input{flex:1;min-width:140px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font:400 12px var(--mono);padding:7px 9px}
.tools button,.tools a{font:600 11px var(--mono);color:var(--text-d2);background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:7px 10px;cursor:pointer;text-decoration:none}
.tools button.active{color:var(--green);border-color:var(--green)}
.tools .count{font:600 11px var(--mono);color:var(--text-d2);margin-left:auto}
table{border-collapse:collapse;width:100%;font:400 12px var(--mono);display:block;overflow-x:auto;white-space:nowrap}
th,td{border:1px solid var(--border);padding:5px 8px;text-align:left;vertical-align:top;max-width:380px;overflow:hidden;text-overflow:ellipsis}
th{background:var(--bg3);color:var(--text);position:sticky;top:0;font-weight:700}
tr:hover td{background:var(--bg3)}
pre{font:400 12px/1.5 var(--mono);color:var(--text-dim);white-space:pre-wrap;word-break:break-word}
pre .k{color:var(--blue)}pre .s{color:var(--green)}pre .n{color:var(--amber)}
.meta-box{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-bottom:12px;font:400 12px var(--mono);color:var(--text-dim)}
.meta-box b{color:var(--text)}
#status{padding:40px;text-align:center;color:var(--text-d2);font:400 13px var(--mono)}
.menu-toggle{display:none}
@media(max-width:860px){
  .nav-pill{padding:3px 7px}
  .wrap{padding:12px 12px 60px}
  header.page h1{font-size:23px}
  .menu-toggle{display:block;width:100%;margin-bottom:10px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--green);font:600 13px var(--mono);padding:11px 12px;text-align:left;cursor:pointer}
  .layout:not(.menu-open) .sidebar{display:none}
  .sidebar{position:static;max-height:none}
  .reader{padding:14px 12px}
}
</style></head><body>
<nav><div class="nav-inner">
  <a class="nav-logo" href="/private/">DRONEWUKONG // INTEL</a>
  <span class="gate-badge">● PRIVATE</span>
  <div class="nav-pills">
    <a class="nav-pill" href="/private/ddg/">DDG Tracker</a>
    <a class="nav-pill" href="/private/dossiers/">Dossiers</a>
    <a class="nav-pill" href="/private/supply-web/">Supply Web</a>
    <a class="nav-pill active" href="/private/data/">Intel Data</a>
  </div>
</div></nav>

<div class="wrap">
  <header class="page">
    <h1>Intel Data</h1>
    <div class="sub">raw private datasets · not on the public API · <span style="color:var(--text-dim)">internal — do not distribute</span></div>
  </header>

  <div class="layout">
    <button class="menu-toggle" id="menuToggle">☰ Browse datasets</button>
    <aside class="sidebar"><div id="nav-list"><div id="status">loading dataset index…</div></div></aside>
    <main class="reader" id="reader"><div id="status2">select a dataset on the left.</div></main>
  </div>
</div>

<script>
// Gated raw-data browser. Fetches /private/data/index.json (manifest written at
// build time) then each /private/data/<file>. Renders array-of-objects as a
// table, otherwise pretty-printed JSON. Dependency-free.
const BASE='/private/data/';
let INDEX=[], CUR=null, RAWMODE=false, CURDATA=null;

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmtBytes(b){if(b>1e6)return (b/1e6).toFixed(1)+' MB';if(b>1e3)return (b/1e3).toFixed(0)+' KB';return b+' B';}

// find the "main" array of objects to table-ify: top-level array, or the
// longest array-of-objects one level deep (e.g. {meta,results:[...]})
function findMainArray(d){
  if(Array.isArray(d)&&d.length&&typeof d[0]==='object')return {key:null,arr:d};
  if(d&&typeof d==='object'){
    let best=null;
    for(const k in d){const v=d[k];if(Array.isArray(v)&&v.length&&typeof v[0]==='object'&&(!best||v.length>best.arr.length))best={key:k,arr:v};}
    return best;
  }
  return null;
}
function cell(v){
  if(v===null||v===undefined)return '';
  if(typeof v==='object')return esc(JSON.stringify(v));
  return esc(v);
}
function renderTable(arr){
  const cols=[];const seen={};
  arr.slice(0,300).forEach(o=>{for(const k in o){if(!seen[k]){seen[k]=1;cols.push(k);}}});
  let h='<table><thead><tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>';
  arr.forEach(o=>{h+='<tr>'+cols.map(c=>'<td title="'+cell(o[c])+'">'+cell(o[c])+'</td>').join('')+'</tr>';});
  return h+'</tbody></table>';
}
function prettyJSON(d){
  let s=esc(JSON.stringify(d,null,2));
  s=s.replace(/&quot;([^&]+?)&quot;(\s*:)/g,'<span class="k">&quot;$1&quot;</span>$2');
  s=s.replace(/: (&quot;[^]*?&quot;)/g,': <span class="s">$1</span>');
  s=s.replace(/: (-?\d+\.?\d*)/g,': <span class="n">$1</span>');
  return '<pre>'+s+'</pre>';
}
function render(){
  const r=document.getElementById('reader');
  if(!CURDATA){r.innerHTML='<div id="status2">select a dataset.</div>';return;}
  const main=findMainArray(CURDATA);
  let meta='';
  if(CURDATA&&CURDATA.meta&&typeof CURDATA.meta==='object'){
    meta='<div class="meta-box">'+Object.entries(CURDATA.meta).map(([k,v])=>'<div><b>'+esc(k)+':</b> '+esc(typeof v==='object'?JSON.stringify(v):v)+'</div>').join('')+'</div>';
  }
  const canTable=!!main;
  let body;
  if(RAWMODE||!canTable){body=prettyJSON(CURDATA);}
  else{body=renderTable(main.arr);}
  const cnt=main?(main.arr.length+(main.key?(' rows · '+main.key):' rows')):'object';
  r.innerHTML=
    '<div class="tools">'+
      (canTable?('<button id="bTable" class="'+(!RAWMODE?'active':'')+'">Table</button><button id="bRaw" class="'+(RAWMODE?'active':'')+'">Raw JSON</button>'):'')+
      '<input id="filter" placeholder="filter rows / text…">'+
      '<a href="'+BASE+CUR.file+'" download>⤓ download</a>'+
      '<span class="count">'+esc(cnt)+'</span>'+
    '</div>'+meta+'<div id="out">'+body+'</div>';
  const bt=document.getElementById('bTable'),br=document.getElementById('bRaw');
  if(bt)bt.onclick=()=>{RAWMODE=false;render();};
  if(br)br.onclick=()=>{RAWMODE=true;render();};
  document.getElementById('filter').addEventListener('input',e=>filterView(e.target.value));
}
function filterView(q){
  q=(q||'').toLowerCase();const out=document.getElementById('out');
  if(out.querySelector('table')){
    out.querySelectorAll('tbody tr').forEach(tr=>{tr.style.display=(!q||tr.textContent.toLowerCase().includes(q))?'':'none';});
  }else{
    // pre: simple show/hide by re-rendering with highlight is overkill; just scroll-hint
    const pre=out.querySelector('pre');if(!pre)return;
    if(!q){pre.innerHTML=pre.dataset.full||pre.innerHTML;return;}
  }
}
async function loadDS(file){
  CUR=INDEX.find(d=>d.file===file);RAWMODE=false;
  document.querySelectorAll('.ds-link').forEach(a=>a.classList.toggle('active',a.dataset.file===file));
  const r=document.getElementById('reader');r.innerHTML='<div id="status2">loading '+esc(file)+'…</div>';
  try{
    const res=await fetch(BASE+file,{cache:'no-store'});
    if(!res.ok)throw new Error(res.status);
    CURDATA=await res.json();render();
    if(window.matchMedia('(max-width:860px)').matches){document.querySelector('.layout').classList.remove('menu-open');r.scrollIntoView({behavior:'smooth',block:'start'});}
    history.replaceState(null,'','#'+file);
  }catch(e){r.innerHTML='<div id="status2">could not load ('+e.message+'). If you were signed out, reload and enter the access password.</div>';}
}
function renderNav(){
  let h='';
  INDEX.forEach(d=>{h+='<a class="ds-link" data-file="'+d.file+'" onclick="loadDS(\''+d.file+'\')"><div class="t">'+esc(d.label)+'</div><div class="d">'+esc(d.desc||'')+'</div><div class="sz">'+fmtBytes(d.bytes||0)+'</div></a>';});
  document.getElementById('nav-list').innerHTML=h||'<div id="status">no datasets available.</div>';
}
(async function(){
  try{
    const res=await fetch(BASE+'index.json',{cache:'no-store'});
    if(!res.ok)throw new Error(res.status);
    INDEX=await res.json();
    if(!INDEX.length){document.getElementById('nav-list').innerHTML='<div id="status">no datasets available (build needs GITHUB_PAT to pull them).</div>';return;}
    renderNav();
    const f=location.hash.replace('#','')||INDEX[0].file;
    loadDS(f);
    document.getElementById('menuToggle').addEventListener('click',()=>document.querySelector('.layout').classList.toggle('menu-open'));
  }catch(e){
    document.getElementById('nav-list').innerHTML='<div id="status">data index unavailable ('+e.message+').<br>If you were signed out, reload and enter the access password. Otherwise the build needs GITHUB_PAT to pull datasets.</div>';
  }
})();
</script>
</body></html>
